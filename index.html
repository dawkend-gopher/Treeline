/* ===== Hunt journal ===== */
journal: { label:'Journal',
  snapshot(t,standId){
    const st=S.stands.find(x=>x.id===standId), lat=st&&st.lat?st.lat:S.location.lat, lon=st&&st.lon?st.lon:S.location.lon;
    const d=new Date(t); d.setHours(0,0,0,0); const day=Astro.day(d.getTime(),lat,lon,S.legalMin,CONFIG.solunar);
    const wx=Weather.at(t), sp=CONFIG.species[S.species]||CONFIG.species.deer, hs=huntScore({t,day,...wx},sp);
    const sol=hs.parts.find(p=>p.k==='solunar'), lt=hs.parts.find(p=>p.k==='light');
    return {score:hs.score, wind:wx.wind, dir:wx.dir!=null?compass(wx.dir):null, temp:wx.temp, pTrend:wx.pTrend, wxSrc:wx.src,
      inSol:sol?sol.v>=.75:false, edge:lt?lt.v>=.7:false, moon:day.moon.name};
  },
  patterns(){
    const L=S.log; if (L.length<3) return '';
    const groups=[
      ['Wind direction', e=>e.dir],
      ['Stand', e=>e.standName],
      ['Barometer', e=>e.pTrend==null?null:e.pTrend<=-.6?'falling':e.pTrend>=.6?'rising':'steady'],
      ['Solunar', e=>e.inSol?'in a period':'between periods'],
      ['Time of day', e=>e.edge?'dawn or dusk':'midday']];
    const rows=groups.map(([name,fn])=>{ const m={}; for (const e of L){ const k=fn(e); if (k==null||k==='') continue; (m[k]=m[k]||[]).push(+e.seen||0); }
      const list=Object.entries(m).map(([k,v])=>({k,n:v.length,avg:v.reduce((a,b)=>a+b,0)/v.length})).sort((a,b)=>b.avg-a.avg);
      if (list.length<2) return ''; const max=Math.max(...list.map(x=>x.avg),1);
      return `<h3 style="font-size:17px;margin:14px 0 6px">${name}</h3>${list.map(x=>`<div class="why" style="grid-template-columns:7.5em minmax(0,1fr) 5.5em;margin-bottom:4px"><span class="small">${esc(x.k)}</span><div class="meter"><i style="width:${Math.round(x.avg/max*100)}%;background:var(--brassbg)"></i></div><span class="tiny muted">${r1(x.avg)} seen · ${x.n} sit${x.n>1?'s':''}</span></div>`).join('')}`; }).join('');
    return rows?`<div class="card"><h3>${ic('book')} What's working for you</h3><p class="small muted" style="margin:4px 0 0">Average animals seen per sit. More sits make this more trustworthy.</p>${rows}</div>`:'';
  },
  render(){
    const L=[...S.log].sort((a,b)=>b.t-a.t), seen=L.reduce((a,e)=>a+(+e.seen||0),0), kills=L.filter(e=>e.harvest).length;
    return `<div class="wrap"><div class="row between"><h1>Hunt journal</h1><button class="brass" id="logbtn" data-log>${ic('plus',18)} Log a sit</button></div>
      <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:14px 0"><div class="card" style="margin:0;text-align:center"><div class="big">${L.length}</div><div class="small muted">sits</div></div><div class="card" style="margin:0;text-align:center"><div class="big">${L.length?r1(seen/L.length):'0'}</div><div class="small muted">seen per sit</div></div><div class="card" style="margin:0;text-align:center"><div class="big">${kills}</div><div class="small muted">harvested</div></div></div>
      ${this.patterns() || `<p class="small muted">${L.length<3?'Log three sits and Treeline starts showing which winds, stands and conditions produce for you.':'Patterns show up once your sits differ in wind, stand, barometer or time of day.'}</p>`}
      ${L.map(e=>`<div class="card"><div class="hd"><div><h3>${new Date(e.t).toLocaleDateString([], {weekday:'short',month:'short',day:'numeric'})} · ${fmtT(e.t)}</h3><div class="small muted">${esc(e.standName||S.location.name)}${e.hours?` · ${e.hours} h`:''}</div></div>${e.harvest?'<span class="badge">Harvest</span>':''}</div>
        <div class="small" style="margin-top:6px"><b>${+e.seen||0}</b> seen · score ${e.score} · ${e.dir?`${Math.round(e.wind)} mph ${e.dir}`:''} · ${e.temp!=null?Math.round(e.temp)+'°F':''} · ${esc(e.moon||'')}</div>
        ${e.notes?`<p class="small muted" style="margin:6px 0 0">${esc(e.notes)}</p>`:''}<div class="row" style="margin-top:8px"><button class="ghost" data-dlog="${e.id}">Delete</button></div></div>`).join('')}</div>`;
  },
  add(){
    const now=new Date(); now.setMinutes(now.getMinutes()-now.getTimezoneOffset()); const local=now.toISOString().slice(0,16);
    const box=openSheet(`<div class="hd"><h2>Log a sit</h2><button class="ghost" data-x>Close</button></div>
      <label for="lg_t">When you started</label><input id="lg_t" type="datetime-local" value="${local}">
      <label for="lg_s">Stand</label><select id="lg_s"><option value="">${esc(S.location.name)}</option>${S.stands.map(st=>`<option value="${st.id}" ${st.id===S.activeStandId?'selected':''}>${esc(st.name)}</option>`).join('')}</select>
      <div class="f2"><div><label for="lg_h">Hours sat</label><input id="lg_h" type="number" step=".5" inputmode="decimal" value="3"></div><div><label for="lg_n">Animals seen</label><input id="lg_n" type="number" inputmode="decimal" value="0"></div></div>
      <label><input type="checkbox" id="lg_k" style="width:22px;min-height:22px"> Harvested</label>
      <label for="lg_no">Notes</label><textarea id="lg_no" placeholder="Two does came in from the creek at 6:50"></textarea>
      <p class="tiny muted">Wind, temperature, barometer, moon and hunt score are filled in automatically from the forecast for that time.</p>
      <button class="pri wide" data-savelog>Save sit</button>`);
    box.querySelector('[data-savelog]').onclick=()=>{ const t=new Date(box.querySelector('#lg_t').value).getTime()||Date.now(), sid=box.querySelector('#lg_s').value, st=S.stands.find(x=>x.id===sid);
      S.log.push({id:uid(), t, standId:sid||null, standName:st?st.name:S.location.name, hours:+box.querySelector('#lg_h').value||'', seen:+box.querySelector('#lg_n').value||0,
        harvest:box.querySelector('#lg_k').checked, notes:box.querySelector('#lg_no').value, ...this.snapshot(t,sid)});
      Store.save(); box.remove(); toast('Sit logged'); go(); };
  },
  bind(){
    $$('[data-log]').forEach(b=>b.onclick=()=>this.add());
    $$('[data-dlog]').forEach(b=>b.onclick=()=>{ if (!b.dataset.sure){ b.dataset.sure=1; b.textContent='Tap again to delete'; return; } S.log=S.log.filter(e=>e.id!==b.dataset.dlog); Store.save(); go(); });
  }
},

/* ===== In the stand: one big answer, made for cold hands and low light ===== */
stand: { label:'In the stand',
  st:{yd:100, wind:0, from:'R', angle:false},
  render(){
    const r=rifle(), l=curLoad(), z=this.st, stand=S.stands.find(x=>x.id===S.activeStandId), ok=+l.bc>0&&+l.mv>0;
    const day=Astro.day(midnight(0),S.location.lat,S.location.lon,S.legalMin,CONFIG.solunar), now=Date.now();
    let light=''; if (day.legalStart&&day.legalEnd){ if (now<day.legalStart) light=`Legal light in ${Math.ceil((day.legalStart-now)/6e4)} min`; else if (now<day.legalEnd) light=`Legal light ends in ${Math.floor((day.legalEnd-now)/6e4)} min`; else light='Past legal light'; }
    let main='Add BC and velocity in the Locker', sub='';
    if (ok){ const ang=z.angle&&stand&&stand.height?-Math.atan(stand.height/(z.yd*3))/DEG:0;
      const x=tbl(r,l,{...S.env,windMph:z.wind,windClock:z.from==='R'?3:9,inclineDeg:ang},[z.yd])[0];
      if (x){ const up=Math.round(x.upClicks); main=Math.abs(x.dropIn)<.75?'DEAD ON':`HOLD ${r1(Math.abs(x.dropIn))}" ${x.dropIn<0?'HIGH':'LOW'}`;
        sub=`or dial ${up===0?'nothing':`${up>0?'UP':'DOWN'} ${Math.abs(up)}`}${Math.abs(x.driftIn)>=.75?` · wind: hold ${r1(Math.abs(x.driftIn))}" ${x.driftIn<0?'right':'left'}`:''}${ang?` · ${Math.round(-ang)}° down`:''}`; } }
    const chip=(k,v,lab)=>`<button class="${z[k]===v?'on':''}" data-sd="${k}|${v}">${lab}</button>`;
    return `<div class="wrap" style="text-align:center">
      <div class="row between"><a href="#forecast" style="text-decoration:none"><button class="ghost">Back</button></a><span class="small" style="color:var(--blaze)">${esc(light)}</span></div>
      <div class="small muted" style="margin-top:8px">${esc(r.name)} · ${esc(l.name)}</div>
      <div class="os" style="font-size:clamp(46px,14vw,84px);margin:20px 0 6px;color:#d8b46a">${esc(main)}</div><div class="small" style="min-height:1.5em">${esc(sub)}</div>
      <div style="display:grid;grid-template-columns:auto auto minmax(0,1fr) auto auto;gap:6px;align-items:center;margin:22px 0 8px"><button style="padding:0 10px" data-step="-25" aria-label="25 yards closer">−25</button><button style="padding:0 12px" data-step="-5" aria-label="5 yards closer">−5</button><div class="os" style="font-size:40px">${z.yd}<span style="font-size:18px"> yd</span></div><button style="padding:0 12px" data-step="5" aria-label="5 yards farther">+5</button><button style="padding:0 10px" data-step="25" aria-label="25 yards farther">+25</button></div>
      <div class="chips" style="justify-content:center">${[25,50,75,100,150,200,250,300].map(y=>chip('yd',y,y)).join('')}</div>
      <div class="small muted" style="margin-top:16px">Wind (mph)</div><div class="chips" style="justify-content:center">${[0,5,10,15,20].map(w=>chip('wind',w,w)).join('')}</div>
      ${z.wind?`<div class="chips" style="justify-content:center;margin-top:6px">${chip('from','L','From left')}${chip('from','R','From right')}</div>`:''}
      ${stand&&stand.height?`<div style="margin-top:14px">${chip('angle',!z.angle,z.angle?`Using ${stand.height} ft stand angle`:`Add ${stand.height} ft stand angle`)}</div>`:''}
      <p class="tiny muted" style="margin-top:22px">Based on your ${r.zeroYd}-yd zero. Confirm on paper before the season.</p></div>`;
  },
  bind(){
    const z=this.st;
    $$('[data-step]').forEach(b=>b.onclick=()=>{ z.yd=Math.max(10,Math.min(600,z.yd+ +b.dataset.step)); go(); });
    $$('[data-sd]').forEach(b=>b.onclick=()=>{ const [k,v]=b.dataset.sd.split('|'); z[k]= k==='from'?v : k==='angle'?v==='true' : +v; go(); });
    try{ if (navigator.wakeLock && !UIx.wl) navigator.wakeLock.request('screen').then(w=>{ UIx.wl=w; w.addEventListener('release',()=>UIx.wl=null); }).catch(()=>{}); }catch(e){}
  }
},

/* ===== Setup ===== */
setup: { label:'Setup',
  render(){
    const L=S.location;
    return `<div class="wrap"><h1>Setup</h1>
      <div class="card"><h3>${ic('pin')} Hunting spot</h3>
        <label for="s_name">Name</label><input id="s_name" data-loc="name" value="${esc(L.name)}">
        <label for="s_coords">Coordinates</label><input id="s_coords" data-coords value="${L.lat}, ${L.lon}" inputmode="decimal">
        <div class="help">In Google Maps, press and hold your stand, copy the numbers that pop up (like 32.2732, -89.9859), and paste them here.</div>
        <button style="margin-top:12px" data-gps>${ic('pin',18)} Use my phone's location</button></div>
      <div class="card"><h3>${ic('target')} What you're hunting</h3><div class="choice">${Object.entries(CONFIG.species).map(([k,v])=>`<button class="${S.species===k?'on':''}" data-sp="${k}">${esc(v.label)}</button>`).join('')}</div>
        <label for="s_legal">Legal light, minutes before and after ${q('legal')}</label><input id="s_legal" type="number" inputmode="decimal" data-legal value="${S.legalMin}">
        <label for="s_alt">Elevation at your spot (ft)</label><input id="s_alt" type="number" inputmode="decimal" data-alt value="${S.env.altFt}"></div>
      <div class="card"><h3>${ic('check')} Help</h3><div class="row"><button data-tours>Replay the guided tours</button><button data-wiz>Run first-time setup again</button></div></div>
      <div class="card"><h3>${ic('gear')} Your data</h3><p class="small">${Store.mode==='cloud'?'Your rifles and settings save to your Claude account and follow you to any device where you open this page.':'Your rifles and settings are saved on this phone only. Copy a backup now and then.'}</p>
        <div class="row"><button data-copy>Copy backup</button><button data-restore>Restore from backup</button></div>
        <textarea id="s_backup" style="margin-top:12px" placeholder="Paste a backup here, then tap Restore"></textarea>
        <button class="ghost" style="margin-top:12px" data-reset>Reset to sample data</button></div>
      <div class="card"><h3>How the numbers work</h3><p class="small">Sun, moon and solunar times are calculated on your phone from your coordinates, so they work with no signal. The hunt score blends six factors weighted for your species. Ballistics use a standard drag model (G1/G7) with your BC, velocity, scope height, temperature and elevation. They'll get you on paper fast, but always confirm on paper before you hunt.</p></div></div>`;
  },
  bind(){
    $('[data-loc]').onchange=e=>{ S.location.name=e.target.value; Store.save(); };
    $('[data-coords]').onchange=e=>{ const m=e.target.value.match(/(-?\d+(?:\.\d+)?)[,\s]+(-?\d+(?:\.\d+)?)/);
      if (!m || Math.abs(+m[1])>90 || Math.abs(+m[2])>180){ toast('Couldn\'t read those coordinates'); return; }
      S.location.lat=+m[1]; S.location.lon=+m[2]; Store.save(); Weather.load(true).then(()=>toast('Location saved')); };
    $('[data-gps]').onclick=()=>{ if (!navigator.geolocation){ toast('Location isn\'t available here'); return; }
      navigator.geolocation.getCurrentPosition(p=>{ S.location.lat=+p.coords.latitude.toFixed(4); S.location.lon=+p.coords.longitude.toFixed(4); Store.save(); Weather.load(true); go(); },
        ()=>toast('Location is blocked here. Paste coordinates instead.'),{timeout:10000}); };
    $$('[data-sp]').forEach(b=>b.onclick=()=>{ S.species=b.dataset.sp; Store.save(); go(); });
    $('[data-legal]').onchange=e=>{ S.legalMin=+e.target.value||0; Store.save(); };
    $('[data-alt]').onchange=e=>{ S.env.altFt=+e.target.value||0; Store.save(); };
    $('[data-tours]').onclick=()=>{ S.tours={}; Store.save(); toast('Tours will play as you open each tab'); };
    $('[data-wiz]').onclick=()=>Wizard.open();
    $('[data-copy]').onclick=async()=>{ const txt=JSON.stringify(S); $('#s_backup').value=txt;
      try{ await navigator.clipboard.writeText(txt); toast('Backup copied'); }catch(e){ $('#s_backup').select(); toast('Select the text and copy it'); } };
    $('[data-restore]').onclick=()=>{ try{ const o=JSON.parse($('#s_backup').value); if (!o.rifles||!o.rifles.length) throw 0; S=upgrade(o); Store.save(); toast('Restored'); go(); }catch(e){ toast('That backup didn\'t read correctly'); } };
    $('[data-reset]').onclick=e=>{ const b=e.currentTarget; if (!b.dataset.sure){ b.dataset.sure=1; b.textContent='Tap again to erase everything'; return; } S=defaults(); S.onboarded=true; Store.save(); go(); };
  }
}
};

/* ---------- router: the tab bar is built from the Screens object ---------- */
const ORDER = Object.keys(Screens);
function go(){
  const cur = ORDER.includes(location.hash.slice(1)) ? location.hash.slice(1) : 'forecast';
  $('#tabs').innerHTML = TABBAR.map(k=>`<a href="#${k}" class="${k===cur?'cur':''}" ${k===cur?'aria-current="page"':''}>${ic(NAVICON[k]||'target',24)}${Screens[k].label}</a>`).join('');
  const y=window.scrollY;
  try{ $('#view').innerHTML = Screens[cur].render(); Screens[cur].bind && Screens[cur].bind(); }
  catch(err){ $('#view').innerHTML = `<div class="wrap"><div class="warn">Something broke on this screen: ${esc(err.message)}</div></div>`; console.error(err); }
  if (UIx.lastTab===cur) window.scrollTo(0,y); else window.scrollTo(0,0);
  document.body.classList.toggle('night', cur==='stand');
  if (UIx.lastTab!==cur && S.onboarded && !$('.sheet')) setTimeout(()=>Coach.start(cur),400);
  UIx.lastTab=cur;
}
window.addEventListener('hashchange', ()=>{ Coach.clear(); UIx.hour=null; go(); });

/* ---------- start ---------- */
const saved = Store.local(); if (saved && saved.rifles && saved.rifles.length) S = upgrade(saved);
Store.pill(); go();
if (!S.onboarded) Wizard.open();
Weather.load().then(()=>{ if (!$('.sheet')) go(); });
Store.connect(remote=>{
  if (remote && remote.rifles && remote.rifles.length && (remote.updated||0) >= (S.updated||0)){
    S=upgrade(remote); Store.saveLocal(S); const w=$('.sheet'); if (w && S.onboarded) w.remove(); go(); }
  else if (S.updated) Store.push();
});
}
</script>
</body></html>
